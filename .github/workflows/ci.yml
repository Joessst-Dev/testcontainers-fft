name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.23", "1.24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Verify formatting
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # ubuntu-latest ships a running Docker daemon, so Testcontainers talks to the
      # host socket and Ryuk reaps the containers. The emulator image is public, so
      # no registry login is needed.
      - name: Test
        run: go test -race -shuffle=on ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: "1.24"
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
